volumes:
  beta-data:
    external: true
services:
  react:
    image: node:lts-bullseye
    command: /bin/bash run.sh
    working_dir: /app
    volumes:
      - ./ghi/app:/app
    ports:
      - "3000:3000"
    env_file:
      - ./ghi/app/.env
    environment:
      HOST_OS: ${OS}
      NODE_ENV: development
      HOST: "0.0.0.0"
  database:
    image: postgres:14.2-bullseye
    volumes:
      - beta-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    env_file:
      - ./db/.env
    environment:
      - POSTGRES_MULTIPLE_DATABASES=inventory,sales,service
    ports:
      - 15432:5432
  inventory-api:
    build:
      context: ./inventory/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8100:8000"
    volumes:
      - ./inventory/api:/app
    depends_on:
      - database
    env_file:
      - ./inventory/api/.env
    environment:
      WAIT_HOSTS: database:5432
      WAIT_TIMEOUT: 240
  service-api:
    build:
      context: ./service/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8080:8000"
    volumes:
      - ./service/api:/app
    depends_on:
      - database
    env_file:
      - ./service/api/.env
    environment:
      WAIT_HOSTS: database:5432
      WAIT_TIMEOUT: 240
  service-poller:
    build:
      context: ./service/poll
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./service/poll:/app
      - ./service/api/service_project:/app/service_project
      - ./service/api/service_rest:/app/service_rest
    depends_on:
      - database
      - service-api
    env_file:
      - ./service/api/.env
    environment:
      WAIT_HOSTS: database:5432,service-api:8000
      WAIT_TIMEOUT: 240
  sales-api:
    build:
      context: ./sales/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8090:8000"
    volumes:
      - ./sales/api:/app
    depends_on:
      - database
    env_file:
      - ./sales/api/.env
    environment:
      WAIT_HOSTS: database:5432
      WAIT_TIMEOUT: 240
  sales-poller:
    build:
      context: ./sales/poll
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./sales/poll:/app
      - ./sales/api/sales_project:/app/sales_project
      - ./sales/api/sales_rest:/app/sales_rest
    depends_on:
      - database
      - sales-api
    env_file:
      - ./sales/api/.env
    environment:
      WAIT_HOSTS: database:5432,sales-api:8000
      WAIT_TIMEOUT: 240

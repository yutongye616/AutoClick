volumes:
  beta-data:
    external: true
services:
  react:
    image: node:lts-bullseye
    command: /bin/bash run.sh
    working_dir: /app
    volumes:
      - ./ghi/app:/app
    ports:
      - "3000:3000"
    env_file:
      - ./ghi/app/.env
    environment:
      HOST_OS: ${OS}
      NODE_ENV: development
      HOST: "0.0.0.0"
  database:
    image: postgres:14.2-bullseye
    volumes:
      - beta-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    env_file:
      - ./db/.env
    environment:
      - POSTGRES_MULTIPLE_DATABASES=inventory,sales,service
    ports:
      - 15432:5432
  kafka:
    image: apache/kafka:4.2.1
    mem_limit: 512m
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
  inventory-api:
    build:
      context: ./inventory/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8100:8000"
    volumes:
      - ./inventory/api:/app
    depends_on:
      - database
      - kafka
    env_file:
      - ./inventory/api/.env
    environment:
      WAIT_HOSTS: database:5432,kafka:9092
      WAIT_TIMEOUT: 240
  service-api:
    build:
      context: ./service/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8080:8000"
    volumes:
      - ./service/api:/app
    depends_on:
      - database
    env_file:
      - ./service/api/.env
    environment:
      WAIT_HOSTS: database:5432
      WAIT_TIMEOUT: 240
  service-poller:
    build:
      context: ./service/poll
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./service/poll:/app
      - ./service/api/service_project:/app/service_project
      - ./service/api/service_rest:/app/service_rest
    depends_on:
      - database
      - service-api
      - kafka
    env_file:
      - ./service/api/.env
    environment:
      WAIT_HOSTS: database:5432,service-api:8000,kafka:9092
      WAIT_TIMEOUT: 240
  sales-api:
    build:
      context: ./sales/api
      dockerfile: ./Dockerfile.dev
    ports:
      - "8090:8000"
    volumes:
      - ./sales/api:/app
    depends_on:
      - database
    env_file:
      - ./sales/api/.env
    environment:
      WAIT_HOSTS: database:5432
      WAIT_TIMEOUT: 240
  sales-poller:
    build:
      context: ./sales/poll
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./sales/poll:/app
      - ./sales/api/sales_project:/app/sales_project
      - ./sales/api/sales_rest:/app/sales_rest
    depends_on:
      - database
      - sales-api
      - kafka
    env_file:
      - ./sales/api/.env
    environment:
      WAIT_HOSTS: database:5432,sales-api:8000,kafka:9092
      WAIT_TIMEOUT: 240
